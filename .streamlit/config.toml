[server]
headless = true
maxUploadSize = 20
enableCORS = true
corsAllowedOrigins = [
  "http://localhost:8501",
  "http://127.0.0.1:8501",
  "",
]

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#164e41"
backgroundColor = "#f5f7f4"
secondaryBackgroundColor = "#edf1ec"
textColor = "#1f302b"
font = "sans serif"
